<form class="psc-row psc-row-editing" id="discipline-{{ object.pk }}"
      hx-post="{% url 'core:discipline_edit' object.pk %}"
      hx-target="#discipline-{{ object.pk }}" hx-swap="outerHTML">
  {% csrf_token %}
  <div class="psc-row-main psc-form-grid">
    {% for field in form %}{% include "partials/_field.html" %}{% endfor %}
  </div>
  <div class="psc-row-actions">
    <button type="submit" class="btn btn-sm btn-psc">Enregistrer</button>
    <button type="button" class="psc-action"
            hx-get="{% url 'core:discipline_row' object.pk %}"
            hx-target="#discipline-{{ object.pk }}" hx-swap="outerHTML">Annuler</button>
  </div>
</form>
