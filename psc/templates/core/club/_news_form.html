<form class="psc-row psc-row-editing" id="news-{{ object.pk }}"
      hx-post="{% url 'core:news_edit' object.pk %}"
      hx-target="#news-{{ object.pk }}" hx-swap="outerHTML">
  {% csrf_token %}
  <div class="psc-row-main">
    {% for field in form %}
      <div class="psc-field">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}{{ field.errors }}
      </div>
    {% endfor %}
  </div>
  <div class="psc-row-actions">
    <button type="submit" class="btn btn-sm btn-psc">Enregistrer</button>
    <button type="button" class="psc-action"
            hx-get="{% url 'core:news_row' object.pk %}"
            hx-target="#news-{{ object.pk }}" hx-swap="outerHTML">Annuler</button>
  </div>
</form>
