<article class="psc-edition is-removed" id="edition-{{ edition.pk }}" role="status">
  <div class="psc-edition-body">
    <p class="mb-0"><strong>{{ label }}</strong> a été supprimée.
      <span class="psc-muted">Rien n'est perdu, la corbeille la conserve.</span></p>
  </div>
  <div class="psc-edition-cta">
    <button class="btn btn-sm btn-psc" type="button"
            hx-post="{% url 'events:edition_restore' edition.pk %}"
            hx-target="#edition-{{ edition.pk }}" hx-swap="outerHTML">Annuler la suppression</button>
  </div>
</article>
